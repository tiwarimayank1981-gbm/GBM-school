<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e4d8c">
<title>GBM सेकेंडरी स्कूल</title>
<style>
:root{--bg:#f6f4ee;--cd:#fff;--tx:#1f2430;--mu:#6b7280;--pr:#1e4d8c;--pt:#fff;--ok:#15803d;--no:#b91c1c;--bd:#e3dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--cd:#1e222b;--tx:#eceef3;--mu:#9aa3b2;--pr:#6ea0e6;--pt:#0b1220;--ok:#4ade80;--no:#f87171;--bd:#323846}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Devanagari",sans-serif}
header{background:var(--pr);color:var(--pt);padding:12px 16px;text-align:center}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:12px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:12px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:8px}
button{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:9px 13px;cursor:pointer}button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--no);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.tabs .on{background:var(--pr);color:var(--pt)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.r:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pa{display:flex;gap:6px}.pa button{padding:6px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.pa .p.on{background:var(--ok);color:#fff}.pa .a.on{background:var(--no);color:#fff}
.stat{display:flex;gap:8px}.stat div{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:8px}.stat b{display:block;font-size:19px}.err{color:var(--no);font-size:14px}
.ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex:none}.ptabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.ptabs button{white-space:nowrap;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.ptabs .on{background:var(--pr);color:var(--pt)}
</style></head><body>
<header><h1>GBM सेकेंडरी स्कूल</h1><p>प्रधानाचार्य: श्रीमती गुड्डी शर्मा · प्रबंध निदेशक: श्री संतोष कुमार तिवारी</p><p id="st">● जुड़ रहे हैं…</p></header>
<main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,set,update,push,remove,onValue,get}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
/* ===== सेटअप: Firebase Console > Project settings से अपनी असली config यहाँ चिपकाएँ ===== */
const CFG={apiKey:"AIzaSyCPhpbxJ-erFYGWvBhDlCp5e114AWU5bFQ",authDomain:"gbm-secondary-school-2011.firebaseapp.com",databaseURL:"https://gbm-secondary-school-2011-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"gbm-secondary-school-2011",storageBucket:"gbm-secondary-school-2011.firebasestorage.app",messagingSenderId:"753096227415",appId:"1:753096227415:web:bc568e2b37ec69289b0112",measurementId:"G-ZJRWGKCXGS"};
const EMAIL="principal@gbm-school.in"; /* Firebase Authentication में यही ईमेल बनाएँ; पासवर्ड = प्रधानाचार्य का पिन (6+ अंक) */
const app=initializeApp(CFG),db=getDatabase(app),auth=getAuth(app);
const app2=initializeApp(CFG,'sec');
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN'),fd=d=>d.split('-').reverse().join('/'),ph=s=>String(s).replace(/\D/g,'').slice(-10),today=()=>new Date().toISOString().slice(0,10);
const paid=s=>(s.paid||[]).reduce((a,p)=>a+(+p.a||0),0);
let TP=[],TE=[],BU=[],ML=[],LV=[],PC=null,PH='',pt='me';
let RS=[],STF=[],SF=null,SL=false,RL=false,RR={},TT=[];const RF={};
let role=null,S=[],N=[],AD={},me=null,MA={},tab='st',date=today(),cls='',q='',msg='',offs=[],dayOff=null,pend=false;
function sub(p,f){offs.push(onValue(ref(db,p),f,()=>{msg='नेटवर्क/अनुमति त्रुटि';draw()}))}
function clear(){offs.forEach(f=>f());offs=[];dayOff&&dayOff();dayOff=null;S=[];AD={};me=null;MA={};SL=RL=false;RS=[];STF=[];SF=null;RR={}}
function draw(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.dataset.f){pend=true;return}pend=false;$('app').innerHTML=role=='p'?pView():role=='t'?tView():role=='g'?gView():login()}
document.addEventListener('focusout',()=>setTimeout(()=>pend&&draw(),50));
onValue(ref(db,'notices'),x=>{const v=x.val()||{};N=Object.entries(v).map(([id,n])=>({id,...n})).sort((a,b)=>b.ts-a.ts);$('st').textContent='● लाइव जुड़ा';draw()},()=>{$('st').textContent='● ऑफ़लाइन'});
const pubSub=(p,f)=>onValue(ref(db,p),x=>{f(Object.entries(x.val()||{}).map(([id,v])=>({id,...v})));draw()});
pubSub('toppers',a=>TP=a.sort((x,y)=>y.ts-x.ts));pubSub('teachers',a=>TE=a);pubSub('buses',a=>BU=a);pubSub('timetable',a=>TT=a);
const nl=ed=>`<div class="cd"><h2>सूचनाएँ / दिशा-निर्देश</h2>${N.length?N.map(n=>`<div class="r"><div><b>${esc(n.title)}</b><div>${esc(n.body)}</div><div class="mu">${new Date(n.ts).toLocaleDateString('hi-IN')}</div></div>${ed?`<button class="d" onclick="delN('${n.id}')">हटाएँ</button>`:''}</div>`).join(''):'<p class="mu">कोई सूचना नहीं</p>'}</div>`;
const login=()=>`<div class="cd"><h2>अभिभावक लॉगिन</h2><input id="lc" placeholder="विद्यार्थी कोड (स्कूल से मिला)" autocapitalize="characters"><input id="lm" placeholder="पंजीकृत मोबाइल नंबर" inputmode="numeric"><button onclick="pGo($('lc').value.trim().toUpperCase(),$('lm').value)">देखें</button></div>${nl(0)}<div class="cd"><h2>प्रधानाचार्य</h2><input id="lp" type="password" placeholder="पिन" inputmode="numeric"><button class="g" onclick="prGo()">प्रवेश</button></div><div class="cd"><h2>शिक्षक लॉगिन</h2><input id="tm" placeholder="मोबाइल नंबर" inputmode="numeric"><input id="tp" type="password" placeholder="पिन" inputmode="numeric"><button class="g" onclick="tGo()">प्रवेश</button></div>${msg?`<p class="err">${esc(msg)}</p>`:''}`;
async function pGo(c,m,quiet){if(!c)return;try{const s=await get(ref(db,'students/'+c));if(s.exists()&&ph(s.val().phone)==ph(m)){role='g';try{localStorage.setItem('gp',c+'|'+m)}catch(e){}sub('students/'+c,x=>{me=x.val();draw()});sub('att/'+c,x=>{MA=x.val()||{};draw()});PC=c;pt='me';sub('results/'+c,x=>{RR=x.val()||{};draw()});sub('leaves/'+c,x=>{ML=Object.entries(x.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);draw()});msg=''}else if(!quiet)msg='कोड या मोबाइल नंबर गलत है'}catch(e){if(!quiet)msg='जाँच नहीं हो सकी, इंटरनेट देखें'}draw()}
async function prGo(){try{await signInWithEmailAndPassword(auth,EMAIL,$('lp').value.trim());msg=''}catch(e){msg='गलत पिन';draw()}}
function out(){try{localStorage.removeItem('gp')}catch(e){}if(role=='p'||role=='t')signOut(auth);role=null;clear();draw()}
onAuthStateChanged(auth,u=>{if(u){if(u.email===EMAIL){role='p';tab='st';sub('students',x=>{S=Object.entries(x.val()||{}).map(([id,s])=>({id,...s})).sort((a,b)=>(a.cls||'').localeCompare(b.cls||'')||(+a.roll||0)-(+b.roll||0));SL=true;syncRoster();draw()});sub('roster',x=>{RS=Object.entries(x.val()||{}).map(([id,v])=>({id,...v}));RL=true;syncRoster();draw()});sub('staff',x=>{STF=Object.entries(x.val()||{}).map(([id,v])=>({id,...v}));draw()});sub('leaves',x=>{LV=[];Object.entries(x.val()||{}).forEach(([c,o])=>Object.entries(o).forEach(([id,l])=>LV.push({c,id,...l})));LV.sort((a,b)=>b.ts-a.ts);draw()});subDay()}else{role='t';tab='at';cls='';sub('staff/'+u.uid,x=>{SF=x.val();draw()});sub('roster',x=>{RS=Object.entries(x.val()||{}).map(([id,v])=>({id,...v}));draw()});subDay()}}draw()});
function subDay(){dayOff&&dayOff();AD={};dayOff=onValue(ref(db,'attendance/'+date),x=>{AD=x.val()||{};draw()})}
function gMe(){const s=me,f=+s.fee||0,pd=paid(s),ds=Object.keys(MA).sort().reverse();let P=0,A=0;ds.forEach(d=>MA[d]=='P'?P++:A++);
return`<div class="cd"><h2>फ़ीस का ब्यौरा</h2><div class="stat"><div><b>${inr(f)}</b>कुल</div><div><b style="color:var(--ok)">${inr(pd)}</b>जमा</div><div><b style="color:var(--no)">${inr(f-pd)}</b>बकाया</div></div>${(s.paid||[]).map(p=>`<div class="r"><span>${fd(p.d)} <span class="mu">${esc(p.n)}</span></span><b>${inr(p.a)}</b></div>`).join('')}</div>
<div class="cd"><h2>हाज़िरी</h2><div class="stat"><div><b style="color:var(--ok)">${P}</b>उपस्थित</div><div><b style="color:var(--no)">${A}</b>अनुपस्थित</div></div>${ds.slice(0,20).map(d=>`<div class="r"><span>${fd(d)}</span><b style="color:var(--${MA[d]=='P'?'ok':'no'})">${MA[d]=='P'?'उपस्थित':'अनुपस्थित'}</b></div>`).join('')}</div>${nl(0)}`}
function gView(){const s=me;if(!s)return`<div class="cd">विवरण नहीं मिला। <button onclick="out()">वापस</button></div>`;
const T=[['me','मेरा बच्चा'],['tw','टॉपर वॉल'],['te','शिक्षक'],['bu','बस रूट'],['rs','परिणाम'],['tt','टाइम टेबल'],['lv','छुट्टी']];
return`<div class="cd"><div class="r"><h2>${esc(s.name)}</h2><button class="g" onclick="out()">बाहर</button></div><div class="mu">कक्षा ${esc(s.cls)} · रोल ${esc(s.roll)} · अभिभावक: ${esc(s.father)}</div></div><div class="ptabs">${T.map(t=>`<button class="${pt==t[0]?'on':''}" onclick="pt='${t[0]}';draw()">${t[1]}</button>`).join('')}</div>`+({me:gMe,tw:()=>twL(0),te:()=>teC(0),bu:()=>buC(0),lv:gLv,rs:gRs,tt:gTt}[pt]||gMe)()}
function pView(){const pc=LV.filter(l=>l.status=='pending').length,T=[['st','विद्यार्थी'],['at','हाज़िरी'],['fe','फ़ीस'],['lv','छुट्टी'+(pc?' ('+pc+')':'')],['rs','परिणाम'],['tt','टाइम टेबल'],['no','सूचना'],['tp','टॉपर'],['te','शिक्षक'],['bu','बस'],['pn','पिन']];
return`<div class="r"><b>प्रधानाचार्य पैनल</b><button class="g" onclick="out()">बाहर</button></div><div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('')}</div>`+({st:stT,at:atT,fe:feT,no:noT,pn:pnT,tp:tpT,te:teT,bu:buT,lv:lvT,rs:rsT,tt:ttT}[tab]||stT)()+(msg?`<p class="err">${esc(msg)}</p>`:'')}
const flt=()=>S.filter(s=>!q||(s.name+s.cls+s.id).toLowerCase().includes(q.toLowerCase()));
function stL(){const b=location.href.split('#')[0];return flt().map(s=>`<div class="r"><div><b>${esc(s.name)}</b><div class="mu">कक्षा ${esc(s.cls)} · रोल ${esc(s.roll)} · कोड: <b>${s.id}</b></div><a class="mu" target="_blank" href="https://wa.me/91${ph(s.phone)}?text=${encodeURIComponent('GBM स्कूल ऐप: '+b+'\nविद्यार्थी: '+s.name+'\nकोड: '+s.id+'\nमोबाइल: '+s.phone)}">WhatsApp पर भेजें</a></div><button class="d" onclick="delS('${s.id}')">हटाएँ</button></div>`).join('')}
const stT=()=>`<div class="cd"><h2>नया विद्यार्थी</h2>${['नाम','कक्षा','रोल नंबर','अभिभावक का नाम','मोबाइल नंबर','कुल वार्षिक फ़ीस (₹)'].map((p,i)=>`<input id="n${i}" data-f=1 placeholder="${p}"${i>3?' inputmode="numeric"':''}>`).join('')}<button onclick="addS()">जोड़ें</button></div><div class="cd"><h2>सभी विद्यार्थी (${S.length})</h2><input data-f=1 placeholder="खोजें (नाम/कक्षा/कोड)" value="${esc(q)}" oninput="q=this.value;$('lst').innerHTML=stL()"><div id="lst">${stL()}</div></div>`;
const addS=()=>{const v=[0,1,2,3,4,5].map(i=>$('n'+i).value.trim());if(!v[0]||ph(v[4]).length<10){msg='नाम और 10 अंक का मोबाइल ज़रूरी है';return draw()}const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(8));let id='';r.forEach(x=>id+=a[x%32]);set(ref(db,'students/'+id),{name:v[0],cls:v[1],roll:v[2],father:v[3],phone:ph(v[4]),fee:+v[5]||0}).then(()=>{msg='';pend=false;draw()}).catch(()=>{msg='सेव नहीं हुआ';draw()})};
const delS=id=>confirm('यह विद्यार्थी हटाएँ?')&&update(ref(db),{['students/'+id]:null,['att/'+id]:null});
function atT(){const cl=[...new Set(S.map(s=>s.cls))],L=S.filter(s=>!cls||s.cls==cls);let P=0,A=0;L.forEach(s=>AD[s.id]=='P'?P++:AD[s.id]=='A'&&A++);
return`<div class="cd"><h2>हाज़िरी</h2><input type="date" value="${date}" onchange="date=this.value;subDay();draw()"><select onchange="cls=this.value;draw()"><option value="">सभी कक्षाएँ</option>${cl.map(c=>`<option ${c==cls?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="stat"><div><b>${L.length}</b>कुल</div><div><b style="color:var(--ok)">${P}</b>उपस्थित</div><div><b style="color:var(--no)">${A}</b>अनुपस्थित</div></div><br><button class="g" onclick="markAll()">सबको उपस्थित करें</button>${L.map(s=>`<div class="r"><span>${esc(s.name)} <span class="mu">${esc(s.cls)}</span></span><div class="pa"><button class="p ${AD[s.id]=='P'?'on':''}" onclick="mark('${s.id}','P')">उप.</button><button class="a ${AD[s.id]=='A'?'on':''}" onclick="mark('${s.id}','A')">अनु.</button></div></div>`).join('')}</div>`}
const mark=(id,v)=>update(ref(db),{['attendance/'+date+'/'+id]:v,['att/'+id+'/'+date]:v});
const markAll=()=>{if(!confirm('दिखाई दे रहे सभी विद्यार्थी "उपस्थित" करें?'))return;const u={};S.filter(s=>!cls||s.cls==cls).forEach(s=>{if(!AD[s.id]){u['attendance/'+date+'/'+s.id]='P';u['att/'+s.id+'/'+date]='P'}});update(ref(db),u)};
function feL(){return flt().map(s=>{const d=(+s.fee||0)-paid(s);return`<div class="r"><div><b>${esc(s.name)}</b> <span class="mu">${esc(s.cls)}</span><div class="mu">कुल ${inr(s.fee)} · जमा ${inr(paid(s))} · <b style="color:var(--${d>0?'no':'ok'})">बकाया ${inr(d)}</b></div></div><div><button onclick="dep('${s.id}')">जमा</button> <button class="g" onclick="setFee('${s.id}')">कुल</button></div></div>`}).join('')}
const feT=()=>`<div class="cd"><h2>फ़ीस प्रबंधन</h2><input data-f=1 placeholder="खोजें (नाम/कक्षा/कोड)" value="${esc(q)}" oninput="q=this.value;$('lst').innerHTML=feL()"><div id="lst">${feL()}</div></div>`;
const dep=id=>{const a=+prompt('जमा राशि (₹)');if(!a)return;const s=S.find(x=>x.id==id);update(ref(db,'students/'+id),{paid:[...(s.paid||[]),{d:today(),a,n:prompt('टिप्पणी (जैसे अप्रैल की किस्त)')||''}]})};
const setFee=id=>{const v=prompt('कुल वार्षिक फ़ीस (₹)');if(v!==null&&v!=='')update(ref(db,'students/'+id),{fee:+v})};
const noT=()=>`<div class="cd"><h2>नई सूचना</h2><input id="nt" data-f=1 placeholder="शीर्षक"><textarea id="nb" data-f=1 rows="4" placeholder="सूचना / दिशा-निर्देश"></textarea><button onclick="addN()">सभी को भेजें</button></div>`+nl(1);
const addN=()=>{const t=$('nt').value.trim();if(!t)return;push(ref(db,'notices'),{title:t,body:$('nb').value.trim(),ts:Date.now()}).then(()=>{pend=false;draw()})};
const delN=id=>confirm('सूचना हटाएँ?')&&remove(ref(db,'notices/'+id));
const pnT=()=>`<div class="cd"><h2>पिन बदलें</h2><input id="np" data-f=1 type="password" placeholder="नया पिन (कम से कम 6 अंक)" inputmode="numeric"><button onclick="setPin()">पिन बदलें</button></div>`;
const setPin=()=>{const p=$('np').value.trim();if(p.length<6){msg='पिन कम से कम 6 अंक का हो';return draw()}updatePassword(auth.currentUser,p).then(()=>{msg='पिन बदल गया ✓';pend=false;draw()}).catch(()=>{msg='बदला नहीं। बाहर निकलकर दोबारा लॉगिन करें।';draw()})};
const gv=n=>[...Array(n)].map((_,i)=>$('g'+i).value.trim());
const gForm=(t,p,fn)=>`<div class="cd"><h2>${t}</h2>${p.map((x,i)=>`<input id="g${i}" data-f=1 placeholder="${x}">`).join('')}<button onclick="${fn}">जोड़ें</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`;
const okd=()=>{msg='';pend=false;draw()},bad=()=>{msg='सेव नहीं हुआ (नियम जाँचें)';draw()};
const delG=(p,id)=>confirm('हटाएँ?')&&remove(ref(db,p+'/'+id));
const delBtn=(ed,p,id)=>ed?`<button class="d" onclick="delG('${p}','${id}')">✕</button>`:'';
const mn=m=>{const x=(m||'').split('-');return x[1]?new Date(x[0],x[1]-1).toLocaleDateString('hi-IN',{month:'long',year:'numeric'}):''};
const stB=s=>`<b style="color:var(--${s=='approved'?'ok':s=='rejected'?'no':'mu'})">${s=='approved'?'स्वीकृत':s=='rejected'?'अस्वीकृत':'प्रतीक्षा में'}</b>`;
function twL(ed){const g={};TP.forEach(t=>(g[t.month||'']=g[t.month||'']||[]).push(t));const k=Object.keys(g).sort().reverse();
return k.length?k.map(m=>`<div class="cd"><h2>🏆 ${esc(mn(m))} के टॉपर</h2>${g[m].map(t=>`<div class="r"><div style="display:flex;gap:10px;align-items:center">${t.photo?`<img class="ph" src="${esc(t.photo)}">`:'<span class="ph">🏅</span>'}<div><b>${esc(t.name)}</b><div class="mu">कक्षा ${esc(t.cls)} · ${esc(t.note)}</div></div></div>${delBtn(ed,'toppers',t.id)}</div>`).join('')}</div>`).join(''):'<div class="cd"><p class="mu">अभी कोई टॉपर नहीं</p></div>'}
const tpT=()=>`<div class="cd"><h2>टॉपर जोड़ें</h2><input id="g0" data-f=1 placeholder="विद्यार्थी का नाम"><input id="g1" data-f=1 placeholder="कक्षा"><input id="g2" data-f=1 placeholder="उपलब्धि (जैसे: प्रथम स्थान, 95%)"><input id="g3" type="month" value="${today().slice(0,7)}"><input type="file" accept="image/*" onchange="pickPh(this)"><img id="pv" class="ph" ${PH?`src="${PH}"`:'style="display:none"'}><p class="mu">फ़ोटो ज़रूरी नहीं, सिर्फ़ नाम भी चलेगा।</p><button onclick="addTp()">टॉपर वॉल पर लगाएँ</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`+twL(1);
const pickPh=i=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const z=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,160,160);PH=c.toDataURL('image/jpeg',.7);const p=$('pv');p.src=PH;p.style.display='inline-flex'};im.src=r.result};r.readAsDataURL(f)};
const addTp=()=>{const v=gv(4);if(!v[0]){msg='नाम लिखें';return draw()}push(ref(db,'toppers'),{name:v[0],cls:v[1],note:v[2],month:v[3]||today().slice(0,7),photo:PH,ts:Date.now()}).then(()=>{PH='';okd()}).catch(bad)};
const teC=ed=>`<div class="cd"><h2>हमारे शिक्षक (${TE.length})</h2>${TE.length?TE.map(t=>`<div class="r"><div><b>${esc(t.name)}</b><div class="mu">${esc(t.subject)}${t.cls?' · कक्षा '+esc(t.cls)+' के कक्षाध्यापक':''}</div></div><div>${t.phone?`<a href="tel:${esc(ph(t.phone))}">📞</a> `:''}${delBtn(ed,'teachers',t.id)}</div></div>`).join(''):'<p class="mu">अभी सूची खाली है</p>'}</div>`;
const teT=()=>gForm('शिक्षक जोड़ें',['नाम','विषय','कक्षाध्यापक हों तो कक्षा (ज़रूरी नहीं)','मोबाइल (ज़रूरी नहीं)'],'addTe()')+teC(1)+tlT();
const addTe=()=>{const v=gv(4);if(!v[0]){msg='नाम लिखें';return draw()}push(ref(db,'teachers'),{name:v[0],subject:v[1],cls:v[2],phone:v[3]}).then(okd).catch(bad)};
const buC=ed=>`<div class="cd"><h2>बस रूट</h2>${BU.length?BU.map(b=>`<div class="r"><div><b>🚌 ${esc(b.no)}</b><div style="white-space:pre-line">${esc(b.route)}</div><div class="mu">${esc(b.time)} · चालक: ${esc(b.driver)} ${b.phone?`<a href="tel:${esc(ph(b.phone))}">📞</a>`:''}</div></div>${delBtn(ed,'buses',b.id)}</div>`).join(''):'<p class="mu">अभी कोई रूट नहीं</p>'}</div>`;
const buT=()=>gForm('बस जोड़ें',['बस नंबर / नाम','रूट (स्टॉप के नाम, बीच में → लगाएँ)','समय (जैसे: सुबह 7:00)','चालक का नाम','चालक का मोबाइल'],'addBu()')+buC(1);
const addBu=()=>{const v=gv(5);if(!v[0]||!v[1]){msg='बस नंबर और रूट लिखें';return draw()}push(ref(db,'buses'),{no:v[0],route:v[1],time:v[2],driver:v[3],phone:v[4]}).then(okd).catch(bad)};
const gLv=()=>`<div class="cd"><h2>छुट्टी का आवेदन</h2><label class="mu">कब से</label><input type="date" id="lf" value="${today()}"><label class="mu">कब तक</label><input type="date" id="lt" value="${today()}"><textarea id="lr" data-f=1 rows="3" placeholder="कारण लिखें"></textarea><button onclick="sendLv()">आवेदन भेजें</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</div><div class="cd"><h2>मेरे आवेदन</h2>${ML.length?ML.map(l=>`<div class="r"><div>${fd(l.from)}${l.to&&l.to!=l.from?' – '+fd(l.to):''}<div class="mu">${esc(l.reason)}</div></div>${stB(l.status)}</div>`).join(''):'<p class="mu">कोई आवेदन नहीं</p>'}</div>`;
const sendLv=()=>{const f=$('lf').value,t=$('lt').value||f,r=$('lr').value.trim();if(!f||!r){msg='तारीख और कारण लिखें';return draw()}push(ref(db,'leaves/'+PC),{from:f,to:t,reason:r.slice(0,300),status:'pending',name:me.name,cls:me.cls,ts:Date.now()}).then(()=>{msg='आवेदन भेज दिया गया ✓';pend=false;draw()}).catch(()=>{msg='भेजा नहीं जा सका';draw()})};
const lvT=()=>`<div class="cd"><h2>छुट्टी के आवेदन</h2>${LV.length?LV.map(l=>`<div class="r"><div><b>${esc(l.name)}</b> <span class="mu">कक्षा ${esc(l.cls)}</span><div>${fd(l.from)}${l.to&&l.to!=l.from?' से '+fd(l.to):''}</div><div>${esc(l.reason)}</div>${stB(l.status)}</div>${l.status=='pending'?`<div><button onclick="setLv('${l.c}','${l.id}','approved')">✓</button> <button class="d" onclick="setLv('${l.c}','${l.id}','rejected')">✕</button></div>`:''}</div>`).join(''):'<p class="mu">कोई आवेदन नहीं</p>'}</div>`;
const setLv=(c,id,st)=>update(ref(db,'leaves/'+c+'/'+id),{status:st});

const sk=s=>String(s).replace(/[.$#\[\]\/]/g,'-');
const DAYS=['सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
function syncRoster(){if(role!='p'||!SL||!RL)return;const R={};RS.forEach(r=>R[r.id]=r);const u={};let n=0;S.forEach(s=>{const r=R[s.id];if(!r||r.name!=s.name||r.cls!=(s.cls||'')||String(r.roll||'')!=String(s.roll||'')){u['roster/'+s.id]={name:s.name||'',cls:s.cls||'',roll:s.roll||''};n++}});RS.forEach(r=>{if(!S.find(s=>s.id==r.id)){u['roster/'+r.id]=null;n++}});if(n)update(ref(db),u)}
const tGo=async()=>{try{await signInWithEmailAndPassword(auth,ph($('tm').value)+'@gbm-school.in',$('tp').value.trim());msg=''}catch(e){msg='मोबाइल या पिन गलत है';draw()}};
function tView(){if(!SF)return`<div class="cd">आपका लॉगिन चालू नहीं है या कक्षा तय नहीं हुई। <button onclick="out()">बाहर</button></div>`;
S=RS.filter(s=>s.cls===SF.cls).sort((a,b)=>(+a.roll||0)-(+b.roll||0));cls='';
const T=[['at','हाज़िरी'],['rs','परिणाम'],['pn','पिन']];
return`<div class="r"><b>शिक्षक: ${esc(SF.name)} · कक्षा ${esc(SF.cls)}</b><button class="g" onclick="out()">बाहर</button></div><div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('')}</div>`+({at:atT,rs:rsT,pn:pnT}[tab]||atT)()+(msg?`<p class="err">${esc(msg)}</p>`:'')}
const rsT=()=>{const t=role=='t',cl=[...new Set(S.map(s=>s.cls))],c=t?'':(RF.rc||''),L=S.filter(s=>t||(c&&s.cls==c));
return`<div class="cd"><h2>परीक्षा के अंक दर्ज करें</h2>${t?'':`<select id="rc" onchange="RF.rc=this.value;draw()"><option value="">कक्षा चुनें</option>${cl.map(x=>`<option ${x==c?'selected':''}>${esc(x)}</option>`).join('')}</select>`}<input id="r0" data-f=1 placeholder="परीक्षा का नाम (जैसे: त्रैमासिक)" value="${esc(RF.r0)}" oninput="RF.r0=this.value"><input id="r1" data-f=1 placeholder="विषय" value="${esc(RF.r1)}" oninput="RF.r1=this.value"><input id="r2" data-f=1 inputmode="numeric" placeholder="पूर्णांक (जैसे 100)" value="${esc(RF.r2)}" oninput="RF.r2=this.value">${(t||c)?L.map(s=>`<div class="r"><span>${esc(s.name)} <span class="mu">रोल ${esc(s.roll)}</span></span><input style="width:90px;margin:0" data-f=1 inputmode="decimal" id="m_${s.id}" placeholder="अंक" value="${esc(RF['m_'+s.id])}" oninput="RF[this.id]=this.value"></div>`).join(''):'<p class="mu">पहले कक्षा चुनें</p>'}<br><button onclick="saveRs()">अंक सेव करें</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`};
const saveRs=()=>{const ex=(RF.r0||'').trim(),sb=(RF.r1||'').trim(),mx=+RF.r2;if(!ex||!sb||!mx){msg='परीक्षा, विषय और पूर्णांक लिखें';return draw()}
const t=role=='t',c=RF.rc||'',u={};let n=0;S.filter(s=>t||s.cls==c).forEach(s=>{const v=RF['m_'+s.id];if(v===undefined||v==='')return;const m=+v;if(isNaN(m)||m<0||m>mx)return;u['results/'+s.id+'/'+sk(ex)+'__'+sk(sb)]={exam:ex,subj:sb,marks:m,max:mx,ts:Date.now()};n++});
if(!n){msg='कम से कम एक विद्यार्थी के सही अंक भरें';return draw()}
update(ref(db),u).then(()=>{Object.keys(RF).filter(k=>k.slice(0,2)=='m_').forEach(k=>delete RF[k]);msg='सेव हुआ ✓ ('+n+' विद्यार्थी)';pend=false;draw()}).catch(()=>{msg='सेव नहीं हुआ';draw()})};
const gRs=()=>{const g={};Object.values(RR).forEach(r=>(g[r.exam]=g[r.exam]||[]).push(r));const k=Object.keys(g).sort((a,b)=>Math.max(...g[b].map(r=>r.ts||0))-Math.max(...g[a].map(r=>r.ts||0)));
return k.length?k.map(e=>{const L=g[e].sort((a,b)=>a.subj.localeCompare(b.subj)),m=L.reduce((a,r)=>a+r.marks,0),x=L.reduce((a,r)=>a+r.max,0);return`<div class="cd"><h2>📝 ${esc(e)}</h2>${L.map(r=>`<div class="r"><span>${esc(r.subj)}</span><b>${r.marks} / ${r.max}</b></div>`).join('')}<div class="r"><b>कुल</b><b>${m} / ${x} (${x?Math.round(m*1000/x)/10:0}%)</b></div></div>`}).join(''):'<div class="cd"><p class="mu">अभी कोई परिणाम दर्ज नहीं</p></div>'};
const ttL=(ed,c)=>{const L=TT.filter(t=>c===undefined||t.cls===c).sort((a,b)=>a.cls.localeCompare(b.cls)||DAYS.indexOf(a.day)-DAYS.indexOf(b.day));return L.length?L.map(t=>`<div class="cd"><div class="r"><h2>${ed?esc(t.cls)+' · ':''}${esc(t.day)}</h2>${delBtn(ed,'timetable',t.id)}</div><div style="white-space:pre-line">${esc(t.text)}</div></div>`).join(''):'<div class="cd"><p class="mu">टाइम टेबल अभी नहीं लगा है</p></div>'};
const gTt=()=>ttL(0,me.cls);
const ttT=()=>{const cl=[...new Set(S.map(s=>s.cls))];return`<div class="cd"><h2>टाइम टेबल लगाएँ</h2><select id="tc" onchange="RF.tc=this.value"><option value="">कक्षा चुनें</option>${cl.map(x=>`<option ${x==RF.tc?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="td" onchange="RF.td=this.value">${DAYS.map(d=>`<option ${d==(RF.td||DAYS[0])?'selected':''}>${d}</option>`).join('')}</select><textarea id="tx" data-f=1 rows="6" placeholder="हर पीरियड नई लाइन में, जैसे:&#10;1. हिंदी 8:00-8:40&#10;2. गणित 8:40-9:20" oninput="RF.tx=this.value">${esc(RF.tx)}</textarea><button onclick="saveTt()">सेव करें</button>${msg?`<p class="err">${esc(msg)}</p>`:''}<p class="mu">उसी कक्षा और दिन पर दोबारा सेव करने से पुराना बदल जाता है।</p></div>`+ttL(1)};
const saveTt=()=>{const c=$('tc').value,d=$('td').value,t=$('tx').value.trim();if(!c||!t){msg='कक्षा और टाइम टेबल लिखें';return draw()}set(ref(db,'timetable/'+sk(c)+'__'+d),{cls:c,day:d,text:t,ts:Date.now()}).then(()=>{RF.tx='';okd()}).catch(bad)};
const tlT=()=>{const cl=[...new Set(S.map(s=>s.cls))];return`<div class="cd"><h2>शिक्षक लॉगिन बनाएँ</h2><p class="mu">शिक्षक मोबाइल और पिन से लॉगिन करके अपनी कक्षा की हाज़िरी और परीक्षा के अंक भर सकेंगे।</p><input id="tl0" data-f=1 placeholder="शिक्षक का नाम"><input id="tl1" data-f=1 placeholder="मोबाइल नंबर" inputmode="numeric"><input id="tl2" data-f=1 type="password" placeholder="पिन (कम से कम 6 अंक)" inputmode="numeric"><select id="tl3"><option value="">कक्षा चुनें</option>${cl.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="addTL()">लॉगिन बनाएँ</button></div><div class="cd"><h2>शिक्षक लॉगिन (${STF.length})</h2>${STF.map(t=>`<div class="r"><div><b>${esc(t.name)}</b><div class="mu">कक्षा ${esc(t.cls)} · ${esc(t.phone)}</div></div><button class="d" onclick="delTL('${t.id}')">बंद करें</button></div>`).join('')||'<p class="mu">अभी कोई नहीं</p>'}</div>`};
const addTL=async()=>{const n=$('tl0').value.trim(),m=ph($('tl1').value),p=$('tl2').value.trim(),c=$('tl3').value;if(!n||m.length<10||p.length<6||!c){msg='नाम, 10 अंक का मोबाइल, 6+ अंक का पिन और कक्षा ज़रूरी हैं';return draw()}
try{const a2=getAuth(app2),cr=await createUserWithEmailAndPassword(a2,m+'@gbm-school.in',p);await set(ref(db,'staff/'+cr.user.uid),{name:n,cls:c,phone:m});await signOut(a2);msg='शिक्षक का लॉगिन बन गया ✓'}catch(e){msg=e.code=='auth/email-already-in-use'?'यह मोबाइल पहले से जुड़ा है':'नहीं बन सका ('+(e.code||'त्रुटि')+')'}pend=false;draw()};
const delTL=id=>confirm('इस शिक्षक का लॉगिन बंद करें?')&&remove(ref(db,'staff/'+id));

Object.assign(window,{RF,tGo,saveRs,saveTt,addTL,delTL,pickPh,addTp,addTe,addBu,delG,sendLv,setLv,$,pGo,prGo,out,delS,addS,mark,markAll,dep,setFee,addN,delN,setPin,subDay,draw,stL,feL});
Object.defineProperties(window,{tab:{get:()=>tab,set:v=>tab=v,configurable:true},q:{get:()=>q,set:v=>q=v,configurable:true},date:{get:()=>date,set:v=>date=v,configurable:true},cls:{get:()=>cls,set:v=>cls=v,configurable:true},pt:{get:()=>pt,set:v=>pt=v,configurable:true}});
try{const l=localStorage.getItem('gp');if(l){const[c,m]=l.split('|');pGo(c,m,true)}}catch(e){}
draw();
</script></body></html>
